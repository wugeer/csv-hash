name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows portable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build WinForms app
        run: msbuild windows\CsvHash.WinForms\CsvHash.WinForms.csproj /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Package portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release
          Copy-Item windows/CsvHash.WinForms/bin/Release/CSV.Hash.exe dist-release/CSV.Hash.exe
          Compress-Archive -Path dist-release/CSV.Hash.exe -DestinationPath dist-release/CSV.Hash_${{ github.ref_name }}_windows-portable.zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/CSV.Hash_${{ github.ref_name }}_windows-portable.zip
          tag_name: ${{ github.ref_name }}
          name: CSV Hash ${{ github.ref_name }}
          body: CSV Hash WinForms desktop client release.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
